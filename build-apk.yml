name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Секреты из настроек репозитория (Settings → Secrets → Actions) кладём в файлы на время сборки
      - name: Restore keystore and google-services.json
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android-project/fugas-release.jks
          echo "$GOOGLE_SERVICES_B64" | base64 -d > android-project/app/google-services.json

      - name: Build release APK
        working-directory: android-project
        env:
          FUGAS_KEYSTORE: ${{ github.workspace }}/android-project/fugas-release.jks
          FUGAS_STORE_PASSWORD: ${{ secrets.FUGAS_STORE_PASSWORD }}
          FUGAS_KEY_ALIAS: ${{ secrets.FUGAS_KEY_ALIAS }}
          FUGAS_KEY_PASSWORD: ${{ secrets.FUGAS_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: fugas-apk
          path: android-project/app/build/outputs/apk/release/*.apk
